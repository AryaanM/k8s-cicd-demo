apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-app-blue
  labels:
    app: bluegreen-app
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-app
      slot: blue
  template:
    metadata:
      labels:
        app: bluegreen-app
        slot: blue
    spec:
      containers:
        - name: app
          image: bluegreen-demo:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0-blue"
            - name: DEPLOYMENT_SLOT
              value: "BLUE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-app-green
  labels:
    app: bluegreen-app
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-app
      slot: green
  template:
    metadata:
      labels:
        app: bluegreen-app
        slot: green
    spec:
      containers:
        - name: app
          image: bluegreen-demo:v2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0-green"
            - name: DEPLOYMENT_SLOT
              value: "GREEN"
---
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-service
spec:
  type: NodePort
  selector:
    app: bluegreen-app
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
