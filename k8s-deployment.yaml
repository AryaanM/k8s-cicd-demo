apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-cicd-app
  labels:
    app: k8s-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-cicd-app
  template:
    metadata:
      labels:
        app: k8s-cicd-app
    spec:
      containers:
        - name: app
          image: k8s-cicd-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-cicd-service
spec:
  type: NodePort
  selector:
    app: k8s-cicd-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
